theme = '_menus_ttms'
languageCode = 'en-TT'
title = 'Brgrs n Wngs'
baseURL = 'https://brgrsnwngs.ttmenus.com/'
enableRobotsTXT = true
timeout = '180s'

# Mount home, generated menu tree, and theme pages (dashboard, locations, api).
[module]
  [[module.mounts]]
    source = "content/_index.md"
    target = "content/_index.md"
  [[module.mounts]]
    source = "content/.generated"
    target = "content"
  [[module.mounts]]
    source = "themes/_menus_ttms/content"
    target = "content"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      attribute = true

[outputFormats]
  [outputFormats.menuitemsJSON]
    mediaType = "application/json"
    baseName = "menu-items"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "JSON"]
  section = ["HTML", "JSON"]
  page = ["HTML", "JSON"]

[params]
  tier = "free"
  description = "Brgrs n Wngs — halal certified burgers, wings, and fries in Chaguanas. Build your meal with sides and dipping sauces. View our menu and order online."
  authServiceUrl = "https://auth.ttmenus.com"
  adsServiceUrl = "https://ads.ttmenus.com"
  notifyServiceUrl = "https://notify.ttmenus.com"

